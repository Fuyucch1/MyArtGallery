{# templates/partials/navbar.html #}
<nav class="fw-nav" role="navigation" aria-label="Main">
    <div class="fw-nav-bar">
        <a class="fw-brand" href="{{ url_for('index') }}">
      <span class="fw-home-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2v-8.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </span>
            {{ site_title or 'Art Commission Gallery' }}
        </a>

        <div class="fw-nav-links">
            <a href="{{ url_for('index') }}"
               class="{% if request.endpoint == 'index' %}is-active{% endif %}"
               aria-current="{% if request.endpoint == 'index' %}page{% endif %}">Home</a>
            <a href="{{ url_for('commissions') }}"
               class="{% if request.endpoint == 'commissions' %}is-active{% endif %}"
               aria-current="{% if request.endpoint == 'commissions' %}page{% endif %}">Commissions</a>
            <a href="{{ url_for('references') }}"
               class="{% if request.endpoint == 'references' %}is-active{% endif %}"
               aria-current="{% if request.endpoint == 'references' %}page{% endif %}">References</a>
            <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}is-active{% endif %}">About Me</a>
            {% if session.get('authenticated') %}
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' or '/dashboard' in request.path %}is-active{% endif %}" aria-current="{% if request.endpoint == 'dashboard' %}page{% endif %}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
            {% endif %}
        </div>

        <div class="fw-actions">
            <button id="theme-toggle" class="fw-btn" type="button" aria-label="Toggle theme">
        <span class="icon-sun" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5.64 5.64 4.22 4.22m15.56 15.56-1.42-1.42M18.36 5.64l1.42-1.42M4.22 19.78l1.42-1.42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </span>
                <span class="icon-moon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </span>
            </button>
        </div>
                <button class="fw-mobile-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="fw-mobile-panel" >
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
    </div>

    <!-- Mobile panel -->
    <div id="fw-mobile-panel" class="fw-mobile-panel" hidden>
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}is-active{% endif %}">Home</a>
        <a href="{{ url_for('commissions') }}" class="{% if request.endpoint == 'commissions' %}is-active{% endif %}">Commissions</a>
        <a href="{{ url_for('references') }}" class="{% if request.endpoint == 'references' %}is-active{% endif %}">References</a>
        <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}is-active{% endif %}">About Me</a>
        {% if session.get('authenticated') %}
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' or '/dashboard' in request.path %}is-active{% endif %}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </div>
</nav>
