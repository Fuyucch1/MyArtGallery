{% extends 'base.html' %}

{% block main_classes %}d-flex align-items-center{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card border-0">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Initial Setup</h1>
          <p class="text-secondary small">Create your admin account and set a site title.</p>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Site Title</label>
              <input type="text" name="site_title" class="form-control" placeholder="My Commissions" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Admin Username</label>
              <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Admin Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="d-grid">
              <button class="btn btn-primary" style="background: linear-gradient(90deg, var(--brand), var(--brand-2)); border: 0;">Complete setup</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
